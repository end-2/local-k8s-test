apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: nvidia-device-plugin
  template:
    metadata:
      labels:
        app: nvidia-device-plugin
    spec:
      runtimeClassName: nvidia
      priorityClassName: system-node-critical
      nodeSelector:
        local-k8s.nvidia-gpu: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nvidia-device-plugin
          image: nvcr.io/nvidia/k8s-device-plugin:v0.20.0
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: DEVICE_LIST_STRATEGY
              value: cdi-cri
            - name: DEVICE_ID_STRATEGY
              value: uuid
            - name: FAIL_ON_INIT_ERROR
              value: "true"
            - name: MIG_STRATEGY
              value: none
            - name: NVIDIA_DRIVER_ROOT
              value: /
            - name: NVIDIA_CDI_HOOK_PATH
              value: /usr/local/bin/nvidia-cdi-hook
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: driver-root
              mountPath: /driver-root
              readOnly: true
            - name: cdi
              mountPath: /var/run/cdi
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: driver-root
          hostPath:
            path: /
            type: Directory
        - name: cdi
          hostPath:
            path: /etc/cdi
            type: Directory
