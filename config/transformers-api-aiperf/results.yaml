apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aiperf-results
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: aiperf-results
spec:
  automountServiceAccountToken: false
  nodeSelector:
    local-k8s.nvidia-gpu: "true"
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
    - name: reader
      image: busybox:1.37.0
      imagePullPolicy: IfNotPresent
      command: [sh, -c, "while :; do sleep 3600; done"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
      volumeMounts:
        - name: results
          mountPath: /results
          readOnly: true
  volumes:
    - name: results
      persistentVolumeClaim:
        claimName: aiperf-results
