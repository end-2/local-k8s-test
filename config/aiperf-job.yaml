apiVersion: batch/v1
kind: Job
metadata:
  generateName: aiperf-transformers-
  labels:
    app: aiperf
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: aiperf
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      # The local tokenizer is mounted only on this node; no GPU is requested.
      nodeSelector:
        local-k8s.nvidia-gpu: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: aiperf
          image: local/aiperf:0.12.0
          imagePullPolicy: Never
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          args:
            - profile
            - --model
            - Qwen/Qwen3-0.6B
            - --tokenizer
            - /model
            - --url
            - http://transformers-api:8000
            - --endpoint-type
            - chat
            - --streaming
            - --use-server-token-count
            - --synthetic-input-tokens-mean
            - "128"
            - --synthetic-input-tokens-stddev
            - "0"
            - --output-tokens-mean
            - "64"
            - --output-tokens-stddev
            - "0"
            - --extra-inputs
            - ignore_eos:true
            - --concurrency
            - "1"
            - --warmup-request-count
            - "2"
            - --request-count
            - "20"
            - --no-server-metrics
            - --ui
            - none
            - --artifact-dir
            - /results/$(POD_NAME)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: model
              mountPath: /model
              readOnly: true
            - name: results
              mountPath: /results
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model
          hostPath:
            path: /models/Qwen3-0.6B
            type: Directory
        - name: results
          persistentVolumeClaim:
            claimName: aiperf-results
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
