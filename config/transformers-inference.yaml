apiVersion: batch/v1
kind: Job
metadata:
  generateName: transformers-inference-
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        local-k8s.nvidia-gpu: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: inference
          image: local/transformers-qwen3:0.1.0
          imagePullPolicy: Never
          args:
            - --model
            - /model
            - --prompt
            - 대한민국의 수도는 어디인가요? 한 문장으로 답하세요.
            - --batch-size
            - "1"
            - --max-new-tokens
            - "128"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 6Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: model
              mountPath: /model
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model
          hostPath:
            path: /models/Qwen3-0.6B
            type: Directory
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
